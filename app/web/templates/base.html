<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}每日精选{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/tailwind.min.css">
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <style>
    body { font-family: 'Noto Sans SC', system-ui, sans-serif; background-color: #f5f2ed; }
    .serif { font-family: 'Noto Serif SC', Georgia, serif; }
    .item-row { transition: background-color 0.12s ease; }
    .item-row:hover { background-color: #faf8f5; }
    input[type="checkbox"] { accent-color: #b45309; }
  </style>
</head>
<body class="min-h-screen text-stone-900">

  <!-- 深色导航 -->
  <nav class="bg-stone-900 sticky top-0 z-10">
    <div class="max-w-4xl mx-auto px-6 flex items-center gap-5" style="height:52px">
      <a href="/" class="serif text-sm font-semibold tracking-widest text-amber-400 uppercase">每日精选</a>
      <span class="w-px h-3.5 bg-stone-700 shrink-0"></span>
      <div class="flex items-center gap-5 text-xs tracking-wide">
        <a href="/daily"                      class="text-amber-500 hover:text-amber-300 transition-colors font-medium">每日简报</a>
        <a href="/category/banking"           class="text-stone-400 hover:text-white transition-colors">银行运营</a>
        <a href="/category/tech"              class="text-stone-400 hover:text-white transition-colors">技术 AI</a>
        <a href="/category/startup"           class="text-stone-400 hover:text-white transition-colors">创业</a>
        <a href="/category/hualong"           class="text-stone-400 hover:text-white transition-colors">画龙</a>
        <a href="/category/github_trending"   class="text-stone-400 hover:text-white transition-colors">GitHub趋势</a>
        <a href="/summary"                    class="text-stone-400 hover:text-white transition-colors">总结</a>
      </div>
      <div class="ml-auto flex items-center gap-5 text-xs tracking-wide">
        <a href="/search"        class="text-stone-500 hover:text-stone-300 transition-colors">搜索</a>
        <a href="/archive"       class="text-stone-500 hover:text-stone-300 transition-colors">归档</a>
        <a href="/admin/sources" class="text-stone-600 hover:text-stone-400 transition-colors">⚙</a>
        <a href="/logout"        class="text-stone-600 hover:text-stone-400 transition-colors">退出</a>
      </div>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
  </main>

</body>
</html>

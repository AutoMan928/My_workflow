{% extends "base.html" %}
{% block title %}登录 · 每日精选{% endblock %}
{% block content %}
<div class="max-w-xs mx-auto" style="margin-top:6rem">
  <div class="text-center mb-10">
    <h1 class="serif text-2xl font-semibold text-stone-800 tracking-widest uppercase">每日精选</h1>
    <p class="text-stone-400 text-xs mt-2 tracking-wide">私人资讯平台</p>
  </div>
  <form method="post" action="/login" class="flex flex-col gap-3">
    {% if error %}
    <p class="text-red-400 text-xs text-center">{{ error }}</p>
    {% endif %}
    <input type="password" name="password" placeholder="访问密码"
           class="border border-stone-200 bg-white rounded-lg px-4 py-3 text-sm
                  focus:outline-none focus:border-stone-400 placeholder-stone-300 transition-colors"
           autofocus required />
    <button type="submit"
            class="bg-stone-800 text-white rounded-lg py-3 text-xs tracking-widest
                   hover:bg-stone-900 transition-colors uppercase">
      进入
    </button>
  </form>
</div>
{% endblock %}
